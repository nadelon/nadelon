name: Build Chess Coach APK

# Builds the :chess module and publishes the installable APK so it can be
# downloaded from the Actions run (as an artifact) and from a Release.
on:
  push:
    branches:
      - claude/chess-game-analyzer-D5dbi
    paths:
      - 'chess/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/chess-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provision Gradle directly so no committed wrapper jar is required.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle :chess:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :chess:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp chess/build/outputs/apk/debug/*.apk dist/chess-coach-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-coach-debug-apk
          path: dist/chess-coach-debug.apk
          if-no-files-found: error

      - name: Publish rolling pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chess-coach-latest
          name: Chess Coach (latest debug build)
          body: |
            Latest debug build of the Chess Coach app from
            `claude/chess-game-analyzer-D5dbi`.

            Download `chess-coach-debug.apk` below and install it on an
            Android device (API 24+). You may need to allow installing apps
            from unknown sources.
          prerelease: true
          files: dist/chess-coach-debug.apk
